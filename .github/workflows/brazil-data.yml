# Runs the Stat Lab Brazil data scripts and saves the CSVs back into this repo.
#
# Run it by hand: Actions tab -> "Brazil data" -> Run workflow.
# It also runs automatically when either script changes.
name: Brazil data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "brazil_*.py"
      - ".github/workflows/brazil-data.yml"

permissions:
  contents: write   # lets the job commit the CSVs

concurrency:
  group: brazil-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Interlagos history (2021-2025)
        run: python brazil_history_data.py

      - name: São Paulo GP practice
        # OpenF1 refuses requests while a session is live, so don't fail the whole job on this step
        continue-on-error: true
        run: python brazil_practice_data.py

      - name: Save CSVs as a download
        uses: actions/upload-artifact@v4
        with:
          name: brazil-data
          path: |
            brazil_history_out/
            brazil_practice_out/
          if-no-files-found: warn

      - name: Commit CSVs to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brazil_history_out brazil_practice_out
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update Brazil data"
            git push
          fi
